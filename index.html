    <!-- ── GitHub Pages SPA routing fix ────────────────────────────────────── -->
    <script>
      (function(l) {
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function(s) {
            return s.replace(/~and~/g, '&');
          }).join('?');
          window.history.replaceState(null, null,
            l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location));
    </script>

    <!-- ── Google Analytics GA4 — loaded after LCP to avoid blocking paint ──
         TODO: replace G-XXXXXXXXXX with this brand's own GA4 measurement ID. ── -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-XXXXXXXXXX');

      var _gtmDone = false;
      function _loadGTM() {
        if (_gtmDone) return;
        _gtmDone = true;
        var s = document.createElement('script');
        s.async = true;
        s.src = 'https://www.googletagmanager.com/gtag/js?id=G-XXXXXXXXXX';
        document.head.appendChild(s);
      }
      function _scheduleGTM() {
        if ('requestIdleCallback' in window) {
          requestIdleCallback(_loadGTM, { timeout: 3000 });
        } else {
          setTimeout(_loadGTM, 2000);
        }
      }
      // Fire GTM after LCP is reported so it never blocks the initial paint
      try {
        var _lcpObs = new PerformanceObserver(function(list) {
          list.getEntries();
          _lcpObs.disconnect();
          _scheduleGTM();
        });
        _lcpObs.observe({ type: 'largest-contentful-paint', buffered: true });
      } catch(e) { _scheduleGTM(); }
      // Hard fallback: load within 8s regardless
      setTimeout(function() { _scheduleGTM(); }, 8000);
    </script>
